# 推 v* 标签即构建并发布。产物是 ad-hoc 签名的 .app(zip):
# 配好 Developer ID 证书的 secrets 之前,用户侧需要右键打开一次。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 自检
        run: cd OpenimgKit && swift run KitCheck
      # 单独一步可见输出的构建:package-mac.sh 为了本地清爽把编译日志吞进
      # /dev/null,CI 里失败会变成无声的 exit 1
      - name: 构建
        run: cd OpenimgKit && swift build -c release --product OpenimgMac
      - name: 打包
        run: ./package-mac.sh release
      - name: 压缩
        run: ditto -c -k --keepParent build/OpenimgMac.app OpenimgMac.zip
      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" OpenimgMac.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "ad-hoc 签名构建。首次打开:右键 App → 打开 → 再点「打开」;或 \`xattr -d com.apple.quarantine\` 解除隔离。"
