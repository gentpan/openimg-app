# 推 v* 标签时只跑自检,不发布任何产物。
#
# 这里原来会用 ad-hoc 签名打一个包并建 GitHub Release,作为"本地没发就有个兜
# 底"的安排。那个安排现在必须去掉,原因有两条,第二条是硬的:
#
#   1. ad-hoc 包没有团队 ID,Gatekeeper 直接拒。用户下到它只会得到一句「无法
#      验证开发者」,而 README 上写着"经过公证、双击即可打开"。
#   2. **它会污染更新通道。** 更新清单里的下载地址指向 latest release,而客户端
#      在装之前会校验团队 ID —— ad-hoc 包过不了。真正的问题是它抢跑:CI 比人快,
#      标签一推它就先建好 release,于是本地 release.sh 的 `gh release create`
#      失败,而 latest 停在一个所有人都装不上的包上。
#
# 兜底的价值本来就不高:发布必须在本机做(证书与公证凭据在钥匙串里),CI 打的包
# 谁也用不了。所以只留自检——那才是 CI 在这个项目里真正能做的事。
name: checks

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  kitcheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 自检
        run: cd OpenimgKit && swift run KitCheck
      - name: 编译 app
        run: cd OpenimgKit && swift build -c release --product OpenimgMac
